name: replisense-qc-observability
services:
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    # Read root-only credentials/events; retain no capabilities or host write mounts.
    user: "0:0"
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy", "--disable-reporting", "/etc/alloy/config.alloy"]
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.35"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [application]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./blackbox.yml:/etc/alloy/blackbox.yml:ro
      - /run/replisense-qc-observability:/run/credentials:ro
      - /var/log/replisense-ops:/var/log/replisense-ops:ro
      # Only aggregate kernel statistics, not host /proc/PID/environ or Docker socket.
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - alloy-data:/var/lib/alloy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  application:
    external: true
    name: replisense-qc_application
volumes:
  alloy-data: {}
