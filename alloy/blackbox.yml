modules:
  http_2xx:
    prober: http
    timeout: 5s
    http: {valid_status_codes: [200], fail_if_not_ssl: true}
  api_unauthenticated:
    prober: http
    timeout: 5s
    http: {valid_status_codes: [401], fail_if_not_ssl: true, follow_redirects: false}
  internal_health:
    prober: http
    timeout: 5s
    http: {valid_status_codes: [200]}
  node_ready:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      authorization:
        type: Bearer
        credentials_file: /run/credentials/observability-token
  redis_tcp:
    prober: tcp
    timeout: 5s
