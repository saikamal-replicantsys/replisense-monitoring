name: replisense-monitoring
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "2"}
  extra_hosts: ["host.docker.internal:host-gateway"]
  security_opt: ["no-new-privileges:true"]
services:
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.11.2
    ports: ["127.0.0.1:9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB"]
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./secrets:/run/secrets:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
  grafana:
    <<: *runtime
    image: grafana/grafana:13.0.0
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a unique GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
  alertmanager:
    <<: *runtime
    image: prom/alertmanager:v0.32.0
    ports: ["127.0.0.1:9093:9093"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ${ALERTMANAGER_CONFIG:-./alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/run/secrets:ro
      - alertmanager-data:/alertmanager
    mem_limit: 128m
  blackbox:
    <<: *runtime
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    mem_limit: 64m
volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
